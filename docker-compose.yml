services:
  postgres:
    image: postgres:16
    profiles: [postgres]
    environment:
      POSTGRES_DB: ember
      POSTGRES_USER: ember
      POSTGRES_PASSWORD_FILE: /run/secrets/ember_db_password
    secrets:
      - ember_db_password
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ember_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember -d ember"]
      interval: 5s
      timeout: 5s
      retries: 10

secrets:
  ember_db_password:
    file: ./var/postgres-password

volumes:
  ember_pgdata:
